name: Run FIT Testing

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      fit_cli_preset:
        description: FIT preset to run.
        required: false
        type: string
        default: op-multi-lite
      fit_cli_channel:
        description: fit-cli install channel ("latest" or "ci").
        required: false
        type: string
        default: ci

permissions:
  id-token: write

jobs:
  run-rust-fit:
    uses: ./.github/workflows/fit-testing-shared.yml
    with:
      preset: ${{ vars.FIT_CLI_PRESET || inputs.fit_cli_preset || 'qe-set' }}
      performer_image_name: 'rust-fit-performer:main'
      fit_cli_channel: ${{ vars.FIT_CLI_CHANNEL || inputs.fit_cli_channel || 'ci' }}
